<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
</head>
<body>
    <h1>0</h1>
    <button>Increase</button>

    <script>
        let a = 0;
        const btn = document.querySelector('button');
        const h1 = document.querySelector('h1');

        btn.addEventListener('click', () => {
            a++;
            h1.innerHTML = a;
        });
    </script>
</body>
</html>
